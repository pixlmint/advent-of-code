[project]
name = "aoc"
version = "2026"
description = "My Advent of code solutions"
readme = "README.md"
authors = [
    { name = "Christian Gröber", email = "swiss8oy.chg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elf>=1.2.0",
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.53",
    "pygments>=2.21.0",
    "pynvim>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
